<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0b2854" />
      <stop offset="55%" stop-color="#060b14" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#0f64d7">
        <animate attributeName="stop-color" values="#0f64d7;#38bdf8;#0f64d7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f64d7" opacity="0.28" />
    </pattern>

    
    <filter id="cobaltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="800" height="250" fill="url(#bgGlow)" rx="14" stroke="#0f64d7" stroke-width="1.5" stroke-opacity="0.7" />
  <rect width="800" height="250" fill="url(#grid)" rx="14" />

  
  <path d="M-50,120 C150,120 200,45 400,45 S650,120 850,120" fill="none" stroke="url(#traceGrad)" stroke-width="2.2" stroke-dasharray="22 10" opacity="0.75">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="18s" repeatCount="indefinite" />
  </path>
  <path d="M-50,195 C150,195 300,235 400,235 S650,55 850,55" fill="none" stroke="#0f64d7" stroke-width="1.8" stroke-dasharray="16 12" opacity="0.45">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="26s" repeatCount="indefinite" />
  </path>
  <path d="M850,18 C600,18 500,195 400,195 S200,18 -50,18" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="18 14" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="-1000" to="0" dur="22s" repeatCount="indefinite" />
  </path>

  
  <text x="400" y="102" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">
    AASHISH NIRANJAN B
  </text>

  
  <rect x="135" y="128" width="530" height="36" rx="18" fill="#05070c" fill-opacity="0.85" stroke="#0f64d7" stroke-width="1.2" />

  
  <circle cx="172" cy="146" r="4.5" fill="#0f64d7" filter="url(#cobaltGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite" />
  </circle>
  <text x="185" y="151" font-family="monospace" font-size="14.5" font-weight="600" fill="#e6edf3">VLSI &amp; RTL</text>

  <text x="292" y="151" font-family="monospace" font-size="14" fill="#0f64d7">|</text>

  
  <circle cx="318" cy="146" r="4.5" fill="#38bdf8" filter="url(#cobaltGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" begin="0.5s" repeatCount="indefinite" />
  </circle>
  <text x="331" y="151" font-family="monospace" font-size="14.5" font-weight="600" fill="#e6edf3">Embedded Systems</text>

  <text x="492" y="151" font-family="monospace" font-size="14" fill="#0f64d7">|</text>

  
  <circle cx="518" cy="146" r="4.5" fill="#0f64d7" filter="url(#cobaltGlow)">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" begin="1s" repeatCount="indefinite" />
  </circle>
  <text x="531" y="151" font-family="monospace" font-size="14.5" font-weight="600" fill="#e6edf3">Edge &amp; AI</text>

  
  <text x="400" y="204" font-family="monospace" font-size="14" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">
    Architecting from Silicon &amp; RTL to Firmware &amp; Intelligence.
  </text>
</svg>
