<svg fill="none" viewBox="0 0 800 250" width="800" height="250" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes flow {
					0% { stroke-dashoffset: 1000; }
					100% { stroke-dashoffset: 0; }
				}
				@keyframes blink {
					0%, 49% { opacity: 0.3; }
					50%, 100% { opacity: 1; box-shadow: 0 0 10px #0f0; }
				}
				@keyframes glowText {
					0%, 100% { text-shadow: 0 0 5px #00d2ff, 0 0 10px #00d2ff, 0 0 20px #00d2ff; }
					50% { text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff, 0 0 30px #00d2ff; }
				}
				.container {
					font-family: 'Segoe UI', Ubuntu, sans-serif;
					background-color: #0a0a0a;
					background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
					background-size: 20px 20px;
					width: 100%;
					height: 250px;
					display: flex;
					flex-direction: column;
					justify-content: center;
					align-items: center;
					color: white;
					position: relative;
					overflow: hidden;
					border-radius: 12px;
					border: 1px solid #333;
				}
				.circuit-lines {
					position: absolute;
					top: 0; left: 0; width: 100%; height: 100%;
					z-index: 1;
					opacity: 0.6;
				}
				.trace {
					fill: none;
					stroke: #00d2ff;
					stroke-width: 2;
					stroke-dasharray: 20 10;
					animation: flow 20s linear infinite;
				}
				.trace-slow { animation-duration: 30s; stroke: #0077ff;}
				.content { z-index: 2; text-align: center; }
				h1 {
					font-size: 42px; margin: 0; color: #fff;
					text-transform: uppercase; letter-spacing: 2px;
					animation: glowText 3s ease-in-out infinite alternate;
				}
				h3 {
					font-size: 18px; margin: 10px 0; color: #aaa;
					display: flex; align-items: center; justify-content: center; gap: 15px;
				}
				.led {
					width: 8px; height: 8px; background-color: #0f0;
					border-radius: 50%; display: inline-block;
					animation: blink 1s infinite;
				}
				.tagline { font-size: 14px; color: #00d2ff; font-family: monospace; margin-top: 15px;}
			</style>
			<div class="container">
				<svg class="circuit-lines" viewBox="0 0 800 250">
					<path class="trace" d="M-50,125 C150,125 200,50 400,50 S650,125 850,125" />
					<path class="trace trace-slow" d="M-50,200 C150,200 300,250 400,250 S650,50 850,50" />
					<path class="trace" d="M850,10 C600,10 500,200 400,200 S200,10 -50,10" />
					<circle cx="400" cy="125" r="40" stroke="#00d2ff" stroke-width="1" fill="none" opacity="0.5"/>
				</svg>
				
				<div class="content">
					<h1>Aashish Niranjan B</h1>
					<h3>
						<span><span class="led" style="animation-delay: 0s;"></span> Embedded Systems</span>
						<span><span class="led" style="animation-delay: 0.3s;"></span> IoT Architectures</span>
						<span><span class="led" style="animation-delay: 0.6s;"></span> Edge AI</span>
					</h3>
					<p class="tagline">Found at the intersection of Hardware, Data, and Intelligence.</p>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
