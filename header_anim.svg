<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <rect width="800" height="250" fill="#0d1117" rx="12" stroke="#30363d" stroke-width="1"/>
  
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d"/>
    </pattern>
  </defs>
  <rect width="800" height="250" fill="url(#grid)" rx="12"/>

  <path d="M-50,125 C150,125 200,50 400,50 S650,125 850,125" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="20 10" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="20s" repeatCount="indefinite" />
  </path>
  <path d="M-50,200 C150,200 300,250 400,250 S650,50 850,50" fill="none" stroke="#238636" stroke-width="2" stroke-dasharray="20 10" opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="30s" repeatCount="indefinite" />
  </path>
  <path d="M850,10 C600,10 500,200 400,200 S200,10 -50,10" fill="none" stroke="#0077ff" stroke-width="2" stroke-dasharray="20 10" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="-1000" to="0" dur="25s" repeatCount="indefinite" />
  </path>

  <text x="400" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    AASHISH NIRANJAN B
  </text>

  <g transform="translate(400, 160)" font-family="monospace" font-size="16" fill="#8b949e">
    <circle cx="-195" cy="-5" r="5" fill="#238636">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="-180" y="0" text-anchor="start">Embedded Systems</text>

    <circle cx="-15" cy="-5" r="5" fill="#00d2ff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="0" text-anchor="start">IoT Architectures</text>

    <circle cx="175" cy="-5" r="5" fill="#238636">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="190" y="0" text-anchor="start">Edge AI</text>
  </g>

  <text x="400" y="210" font-family="monospace" font-size="14" fill="#00d2ff" text-anchor="middle">
    Found at the intersection of Hardware, Data, and Intelligence.
  </text>
</svg>

