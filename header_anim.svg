<svg fill="none" viewBox="0 0 800 250" width="800" height="250" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				@keyframes flow {
					0% { stroke-dashoffset: 1000; }
					100% { stroke-dashoffset: 0; }
				}
				@keyframes blink {
					0%, 49% { opacity: 0.3; }
					50%, 100% { opacity: 1; box-shadow: 0 0 10px #0f0; }
				}
				@keyframes glowText {
					0%, 100% { text-shadow: 0 0 5px #00d2ff, 0 0 10px #00d2ff; }
					50% { text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff, 0 0 30px #00d2ff; }
				}
				.container {
					font-family: 'Segoe UI', Ubuntu, sans-serif;
					background-color: #0d1117;
					background-image: radial-gradient(#1a1a1a 1px, transparent 1px);
					background-size: 20px 20px;
					width: 100%;
					height: 250px;
					display: flex;
					flex-direction: column;
					justify-content: center;
					align-items: center;
					color: white;
					border-radius: 10px;
				}
				.trace {
					fill: none;
					stroke: #00d2ff;
					stroke-width: 2;
					stroke-dasharray: 20 10;
					animation: flow 20s linear infinite;
					opacity: 0.5;
				}
				h1 {
					font-size: 45px; margin: 0; color: #fff;
					text-transform: uppercase; letter-spacing: 2px;
					animation: glowText 3s ease-in-out infinite alternate;
				}
				h3 {
					font-size: 18px; margin: 10px 0; color: #8b949e;
					display: flex; gap: 15px;
				}
				.led {
					width: 8px; height: 8px; background-color: #238636;
					border-radius: 50%; display: inline-block;
					box-shadow: 0 0 5px #238636;
					animation: blink 2s infinite;
				}
			</style>
			<div class="container">
				<svg style="position:absolute; width:100%; height:100%;">
					<path class="trace" d="M0,50 Q200,50 400,125 T800,200" />
					<path class="trace" style="animation-duration: 15s; stroke: #238636;" d="M0,200 Q200,200 400,125 T800,50" />
				</svg>
				<div style="z-index:2; text-align:center;">
					<h1>Aashish Niranjan</h1>
					<h3>
						<span><span class="led"></span> Embedded Systems</span>
						<span><span class="led" style="animation-delay:0.5s"></span> IoT</span>
						<span><span class="led" style="animation-delay:1s"></span> Edge AI</span>
					</h3>
				</div>
			</div>
		</div>
	</foreignObject>
</svg>
	</foreignObject>
</svg>
