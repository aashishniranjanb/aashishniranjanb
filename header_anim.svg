<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250">
  <defs>
    
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="65%">
      <stop offset="0%" stop-color="#0b2854" />
      <stop offset="55%" stop-color="#060b14" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    
    <linearGradient id="chipCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#0f64d7" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#0f64d7">
        <animate attributeName="stop-color" values="#0f64d7;#38bdf8;#0f64d7" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f64d7" opacity="0.26" />
    </pattern>

    
    <filter id="cobaltGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect width="800" height="250" fill="url(#bgGlow)" rx="14" stroke="#0f64d7" stroke-width="1.5" stroke-opacity="0.75" />
  <rect width="800" height="250" fill="url(#grid)" rx="14" />

  
  <path d="M-50,125 C150,125 200,45 400,45 S650,125 850,125" fill="none" stroke="url(#traceGrad)" stroke-width="2" stroke-dasharray="22 10" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="20s" repeatCount="indefinite" />
  </path>
  <path d="M-50,200 C150,200 300,235 400,235 S650,55 850,55" fill="none" stroke="#0f64d7" stroke-width="1.6" stroke-dasharray="16 12" opacity="0.42">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="28s" repeatCount="indefinite" />
  </path>
  <path d="M850,18 C600,18 500,195 400,195 S200,18 -50,18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="18 14" opacity="0.32">
    <animate attributeName="stroke-dashoffset" from="-1000" to="0" dur="24s" repeatCount="indefinite" />
  </path>

  
  
  
  <g id="chipBoot" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.22;0.68;1" calcMode="spline" keySplines="0.22 1 0.36 1; 0.4 0 0.2 1; 0.4 0 0.2 1" dur="1.45s" fill="freeze" />
    <animateTransform attributeName="transform" type="scale" values="0.92;1;1;0.94" keyTimes="0;0.25;0.68;1" additive="sum" calcMode="spline" keySplines="0.22 1 0.36 1; 0.4 0 0.2 1; 0.4 0 0.2 1" dur="1.45s" fill="freeze" />

    
    <g stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" filter="url(#cobaltGlow)">
      <line x1="372" y1="64" x2="372" y2="77" />
      <line x1="390" y1="64" x2="390" y2="77" />
      <line x1="410" y1="64" x2="410" y2="77" />
      <line x1="428" y1="64" x2="428" y2="77" />

      <line x1="372" y1="173" x2="372" y2="186" />
      <line x1="390" y1="173" x2="390" y2="186" />
      <line x1="410" y1="173" x2="410" y2="186" />
      <line x1="428" y1="173" x2="428" y2="186" />

      
      <line x1="339" y1="97" x2="352" y2="97" />
      <line x1="339" y1="115" x2="352" y2="115" />
      <line x1="339" y1="135" x2="352" y2="135" />
      <line x1="339" y1="153" x2="352" y2="153" />

      <line x1="448" y1="97" x2="461" y2="97" />
      <line x1="448" y1="115" x2="461" y2="115" />
      <line x1="448" y1="135" x2="461" y2="135" />
      <line x1="448" y1="153" x2="461" y2="153" />
    </g>

    
    <rect x="352" y="77" width="96" height="96" rx="12" fill="#05070c" stroke="#0f64d7" stroke-width="2.4" filter="url(#cobaltGlow)" />

    
    <rect x="368" y="93" width="64" height="64" rx="7" fill="url(#chipCoreGrad)" stroke="#38bdf8" stroke-width="1.4" />

    
    <line x1="368" y1="114" x2="432" y2="114" stroke="#05070c" stroke-width="1.4" opacity="0.65" />
    <line x1="368" y1="136" x2="432" y2="136" stroke="#05070c" stroke-width="1.4" opacity="0.65" />
    <line x1="389" y1="93" x2="389" y2="157" stroke="#05070c" stroke-width="1.4" opacity="0.65" />
    <line x1="411" y1="93" x2="411" y2="157" stroke="#05070c" stroke-width="1.4" opacity="0.65" />

    <text x="400" y="212" font-family="monospace" font-size="11.5" fill="#38bdf8" text-anchor="middle" letter-spacing="2.2">
      SILICON DIE READY
    </text>
  </g>

  
  
  
  <g id="heroContent" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.15s" dur="0.8s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="1.15s" dur="0.8s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze" />

    
    <path d="M74,64 L58,64 L58,186 L74,186" fill="none" stroke="#0f64d7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <path d="M726,64 L742,64 L742,186 L726,186" fill="none" stroke="#0f64d7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

    
    <text x="400" y="102" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">
      AASHISH NIRANJAN B
    </text>

    
    <rect x="135" y="128" width="530" height="36" rx="18" fill="#05070c" fill-opacity="0.88" stroke="#0f64d7" stroke-width="1.3" />

    
    <circle cx="172" cy="146" r="4.5" fill="#0f64d7" filter="url(#cobaltGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="185" y="151" font-family="monospace" font-size="14.5" font-weight="600" fill="#e6edf3">VLSI &amp; RTL</text>

    <text x="292" y="151" font-family="monospace" font-size="14" fill="#0f64d7">|</text>

    
    <circle cx="318" cy="146" r="4.5" fill="#38bdf8" filter="url(#cobaltGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="2.1s" repeatCount="indefinite" />
    </circle>
    <text x="331" y="151" font-family="monospace" font-size="14.5" font-weight="600" fill="#e6edf3">Embedded Systems</text>

    <text x="492" y="151" font-family="monospace" font-size="14" fill="#0f64d7">|</text>

    
    <circle cx="518" cy="146" r="4.5" fill="#0f64d7" filter="url(#cobaltGlow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" begin="2.6s" repeatCount="indefinite" />
    </circle>
    <text x="531" y="151" font-family="monospace" font-size="14.5" font-weight="600" fill="#e6edf3">Edge &amp; AI</text>

    
    <text x="400" y="204" font-family="monospace" font-size="14" fill="#60a5fa" text-anchor="middle" letter-spacing="0.5">
      Architecting from Silicon &amp; RTL to Firmware &amp; Intelligence.
    </text>
  </g>
</svg>
