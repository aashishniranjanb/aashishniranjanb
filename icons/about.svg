<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    
    <linearGradient id="aboutPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f64d7">
        <animate attributeName="stop-color" values="#0f64d7;#05070c;#1d8cf8;#0f64d7" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#071e42">
        <animate attributeName="stop-color" values="#071e42;#0f64d7;#05070c;#071e42" dur="4.5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#05070c">
        <animate attributeName="stop-color" values="#05070c;#0f64d7;#071e42;#05070c" dur="4.5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0f64d7" />
    </linearGradient>

    <filter id="aboutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="6" y="9" width="52" height="46" rx="9" fill="url(#aboutPanelGrad)" stroke="#0f64d7" stroke-width="2" />

  
  <path d="M6 18 V18 C6 13 10 9 15 9 H49 C54 9 58 13 58 18 V20 H6 Z" fill="#05070c" opacity="0.75" />
  <line x1="6" y1="20" x2="58" y2="20" stroke="#0f64d7" stroke-width="1.5" stroke-opacity="0.7" />

  
  <circle cx="14" cy="14.5" r="2" fill="#0f64d7" />
  <circle cx="21" cy="14.5" r="2" fill="#38bdf8" />
  <circle cx="28" cy="14.5" r="2" fill="#1e3a8a" />

  
  <polyline points="15,28 24,36 15,44" fill="none" stroke="url(#accentGlow)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#aboutGlow)" />

  
  <line x1="29" y1="43" x2="39" y2="43" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <rect x="42" y="34" width="6" height="11" rx="1.5" fill="#0f64d7">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite" />
  </rect>
</svg>
