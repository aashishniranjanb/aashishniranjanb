<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    
    <linearGradient id="cobaltBlackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f64d7">
        <animate attributeName="stop-color" values="#0f64d7;#05070c;#1d8cf8;#0f64d7" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="55%" stop-color="#092c5c">
        <animate attributeName="stop-color" values="#092c5c;#0f64d7;#05070c;#092c5c" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#05070c">
        <animate attributeName="stop-color" values="#05070c;#0f64d7;#092c5c;#05070c" dur="4s" repeatCount="indefinite" />
      </stop>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 32 32" to="360 32 32" dur="8s" repeatCount="indefinite" />
    </linearGradient>

    
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="10" y="34" width="11" height="22" rx="3" fill="url(#cobaltBlackGrad)" stroke="#0f64d7" stroke-width="1.2">
    <animate attributeName="height" values="22;32;18;22" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="y" values="34;24;38;34" dur="2.6s" repeatCount="indefinite" />
  </rect>

  <rect x="26.5" y="22" width="11" height="34" rx="3" fill="url(#cobaltBlackGrad)" stroke="#0f64d7" stroke-width="1.2">
    <animate attributeName="height" values="34;20;38;34" dur="3.1s" repeatCount="indefinite" />
    <animate attributeName="y" values="22;36;18;22" dur="3.1s" repeatCount="indefinite" />
  </rect>

  <rect x="43" y="14" width="11" height="42" rx="3" fill="url(#cobaltBlackGrad)" stroke="#0f64d7" stroke-width="1.2">
    <animate attributeName="height" values="42;26;36;42" dur="2.4s" repeatCount="indefinite" />
    <animate attributeName="y" values="14;30;20;14" dur="2.4s" repeatCount="indefinite" />
  </rect>

  
  <polyline points="9,24 21,16 33,21 54,9" fill="none" stroke="#0f64d7" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    <animate attributeName="stroke" values="#0f64d7;#4da3ff;#0f64d7" dur="2.5s" repeatCount="indefinite" />
  </polyline>

  
  <circle cx="54" cy="9" r="3.5" fill="#0f64d7" filter="url(#neonGlow)">
    <animate attributeName="r" values="3;5.2;3" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
